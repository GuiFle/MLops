[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
loglevel=info

[program:api]
command=uvicorn src.api:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/api.log
stderr_logfile=/app/logs/api.err.log
stopasgroup=true
killasgroup=true

[program:streamlit]
command=streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/streamlit.log
stderr_logfile=/app/logs/streamlit.err.log
stopasgroup=true
killasgroup=true

